<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-display">
            <div class="previous-operand" id="previous-operand"></div>
            <div class="current-operand" id="current-operand">0</div>
        </div>
        <div class="calculator-buttons">
            <!-- Memory Buttons -->
            <button class="btn btn-mem" data-action="mc">MC</button>
            <button class="btn btn-mem" data-action="mr">MR</button>
            <button class="btn btn-mem" data-action="m-plus">M+</button>
            <button class="btn btn-mem" data-action="m-minus">M-</button>

            <!-- Scientific Functions -->
            <button class="btn btn-sci" data-action="sqrt">√</button>
            <button class="btn btn-sci" data-action="power">xʸ</button>
            <button class="btn btn-sci" data-action="percent">%</button>
            <button class="btn btn-op" data-action="divide">÷</button>

            <!-- Numbers and Basic Ops -->
            <button class="btn" data-number>7</button>
            <button class="btn" data-number>8</button>
            <button class="btn" data-number>9</button>
            <button class="btn btn-op" data-action="multiply">×</button>

            <button class="btn" data-number>4</button>
            <button class="btn" data-number>5</button>
            <button class="btn" data-number>6</button>
            <button class="btn btn-op" data-action="subtract">−</button>

            <button class="btn" data-number>1</button>
            <button class="btn" data-number>2</button>
            <button class="btn" data-number>3</button>
            <button class="btn btn-op" data-action="add">+</button>

            <button class="btn" data-number>0</button>
            <button class="btn" data-number>.</button>
            <button class="btn btn-clear" data-action="clear">AC</button>
            <button class="btn btn-equals" data-action="calculate">=</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
